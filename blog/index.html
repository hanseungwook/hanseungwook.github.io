<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>blog — seungwook han</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Geist+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--muted:#444;--link:#1d4ed8;--square:#6c5ce7;--max:760px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.mono, h1, h2, h3, h4, .topnav, pre, code, kbd, samp {font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace}
.wrapper{max-width:var(--max);margin:0 auto;padding:56px 24px 120px;position:relative}
.brand{position:fixed;top:20px;left:20px;width:18px;height:18px;background:var(--square);border-radius:2px}
.topnav{position:fixed;top:20px;right:20px;z-index:10;font-size:13px;letter-spacing:.02em;font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
.topnav a{margin-left:18px;color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
.topnav a:hover{color:var(--fg);border-bottom-color:var(--fg)}
h1{font-size:40px;line-height:1.15;margin:0 0 8px;font-weight:700}
.lead{margin:0 0 32px;color:var(--muted);font-family:"Inter", sans-serif}
a{color:var(--link);text-underline-offset:3px}
a:hover{opacity:.85}
.post-list{list-style:none;margin:0;padding:0}
.post-list li{margin:0 0 24px;padding:0}
.post-list a{font-size:18px;font-family:"Geist Mono", monospace;text-decoration:none;color:var(--fg);border-bottom:1px solid transparent}
.post-list a:hover{color:var(--link);border-bottom-color:var(--link)}
.post-teaser{display:block;max-width:100%;height:auto;border-radius:6px;margin-bottom:8px}
.post-date{display:block;font-size:13px;color:var(--muted);font-family:"Geist Mono", monospace;margin-top:2px}
.footer{color:#777;font-size:13px;margin-top:60px;font-family:"Geist Mono", monospace}
@media (max-width:640px){h1{font-size:34px}.topnav{position:static;margin-bottom:12px}.brand{position:absolute}}
</style>
</head>
<body>
<div class="brand"></div>
<nav class="topnav" aria-label="primary">
  <a href="/">home</a>
</nav>
<main class="wrapper">
  <h1>blog</h1>
  <p class="lead">things i've been thinking about.</p>

  <ul class="post-list">
    <li>
      <a href="/blog/nca-pre-pre-training/">
        <img src="/blog/nca-pre-pre-training/teaser.png" alt="NCA Pre-Pre-Training teaser" class="post-teaser" />
        Training Language Models via Neural Cellular Automata
      </a>
      <span class="post-date">2026</span>
    </li>
  </ul>

</main>
</body>
</html>
